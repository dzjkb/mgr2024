capacity: 96
latent_size: 256
dilations:
  - [1, 3, 9]
  - [1, 3, 9]
  - [1, 3, 9]
  - [1, 3]
strides: [4, 4, 4, 2] 
lr_decay_steps: 500000
discriminator_lr: 0.000005
initial_lr: 0.00005
final_lr: 0.00002

feature_loss_weight: 20.0
adversarial_loss_weight: 1.0
activation: relu
reduction_method: conv
n_bands: 16

nf_prior_layers: null
nf_posterior_layers: null
monitor_grad_norm: false

stft_mel: true
stft_eps: 0.0001